[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "geoinv3d"
version = "0.1.0"
description = "DAG-based 3D geophysical joint inversion framework built on SimPEG"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "SimPEG>=0.21",
    "discretize>=0.10",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
viz = ["pyvista>=0.40", "vtk>=9.2"]
full = ["pyvista>=0.40", "vtk>=9.2", "networkx>=3.0"]
dev = ["pytest>=7.0", "ruff>=0.1", "mypy>=1.0"]

[project.scripts]
geoinv3d = "geoinv3d.app:main"

[tool.setuptools.packages.find]
include = ["geoinv3d*"]

[tool.ruff]
line-length = 96
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
